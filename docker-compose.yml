services:
  server:
    build: .
    ports:
      - "8787:8787"
    environment:
      OPENPHYSIO_TOKEN: "${OPENPHYSIO_TOKEN:?OPENPHYSIO_TOKEN is required - export it or put it in .env}"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
